<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aden Bungalov - Cevrimdisi</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #f6f3ee, #f2eee6);
        color: #1f1f1f;
      }
      main {
        width: min(420px, 92vw);
        background: #ffffff;
        border: 1px solid #e8dfd1;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 18px 45px rgba(27, 20, 10, 0.08);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.2rem;
      }
      p {
        margin: 0;
        color: #595961;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Aden Bungalov su an cevrimdisi</h1>
      <p>
        Internet baglantisi geri geldiginde sayfayi yenileyerek rezervasyon
        islemlerinize devam edebilirsiniz.
      </p>
    </main>
  </body>
</html>
